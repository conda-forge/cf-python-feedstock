schema_version: 1

context:
  version: "3.21.0"

package:
  name: cf-python
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cf-python/cf_python-${{ version }}.tar.gz
  sha256: 792143b989d7ec91819746fa001389dcbd33aa6be2632fc839db0dbddbed6d80

build:
  number: 0
  skip:
    - match(python, "<3.11")
    - win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - cfdm >=1.13.3.0,<1.13.4.0
    - cftime >=1.6.4
    - cfunits >=3.3.7
    - dask-core >=2025.5.1
    - distributed >=2025.5.1
    - netcdf4 >=1.7.2
    - numpy >=2.0.0
    - packaging >=20.0
    - psutil >=0.6.0
    - pyfive >=1.1.1
    - scipy >=1.10.0
    # Are these still needed?
    # - h5netcdf >=1.3.0
    # - h5py >=3.10.0
    # - s3fs >=2024.6.0

tests:
  - python:
      imports:
        - cf
      pip_check: true
  - requirements:
      run:
        - pytest
        - pycodestyle
        - esmpy
        - mpich
        - pytest-json-report
    files:
      source:
        - cf/test/
    script:
      - pushd cf/test && python create_test_files.py && python setup_create_field.py && python -c "import unittest; from cf.test import test_pp; unittest.main(test_pp)"

about:
  summary: A CF-compliant earth science data analysis library
  license: MIT
  license_file: LICENSE
  homepage: https://ncas-cms.github.io/cf-python

extra:
  recipe-maintainers:
    - davidhassell
    - sadielbartholomew
    - valeriupredoi
    - ocefpaf
